services:
  edu-agent:
    container_name: edu-agent
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../server/.env
    environment:
      PORT: 3000
      EDU_DATA_DIR: /app/data
      OCR_ENGINE: vision
    volumes:
      # SQLite 不能放在 Windows bind mount（9p 无可靠文件锁，node:sqlite 报 disk I/O error），用命名卷
      - app_data:/app/data
      - ../server/uploads:/app/server/uploads
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
