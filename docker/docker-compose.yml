services:
  edu-agent:
    container_name: edu-agent
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../server/.env
    environment:
      PORT: 3000
      MILVUS_ADDRESS: milvus:19530
      EDU_DATA_DIR: /app/data
      DOCLING_URL: http://docling-serve:5001
    volumes:
      # SQLite 不能放在 Windows bind mount（9p 无可靠文件锁，node:sqlite 报 disk I/O error），用命名卷
      - app_data:/app/data
      - ../server/uploads:/app/server/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  # 扫描件解析主路径。按需启用：npm run docling:up
  docling-serve:
    container_name: edu-docling
    image: ${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve-cpu:latest}
    profiles: ["docling"]
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    volumes:
      # 空卷首次挂载时 Docker 会把镜像内置模型复制进来；公式模型下载到这里可跨重建保留
      - docling_models:/opt/app-root/src/.cache/docling/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  etcd:
    container_name: edu-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    container_name: edu-milvus-standalone
    image: docker.m.daocloud.io/milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
    volumes:
      - milvus_data:/var/lib/milvus
      # 单用户本地场景：common.storageType=local，免 MinIO（官方镜像已下架）
      - ./milvus.yaml:/milvus/configs/milvus.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  docling_models:
  etcd_data:
  milvus_data: